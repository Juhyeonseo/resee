<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다시봄 Re:See</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== 색 ===== */
  :root {
    --bg: #F6F3FF; --card: #FFFFFF; --soft: #EFEBFF; --ink: #231F33; --muted: #5E5873;
    --line: #DCD5F2; --accent: #6D4FD8; --accent-ink: #4A35A8;
    --green-soft: #E4F6EC; --green-ink: #1F6B40; --warn-soft: #FFF1D6; --warn: #8A5300;
    --danger-soft: #FCE8E6; --danger: #B3261E;
  }

  /* ===== 기본 ===== */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; line-height: 1.55; }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
  textarea { width: 100%; resize: vertical; min-height: 64px; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 60px; display: flex; flex-direction: column; gap: 24px; }
  .box { background: var(--card); border-radius: 24px; padding: 20px 24px; }
  #app { display: flex; flex-direction: column; gap: 24px; }   /* 주간 달력과 아래 목록·폼 사이 간격 */

  /* ===== 버튼 ===== */
  .btn { font-size: 14px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .btn.main { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
  .btn.main.danger { border-color: var(--danger); background: var(--danger); }
  .btn.text { border: none; background: none; color: var(--muted); padding: 9px 6px; }
  .btn:disabled { opacity: .7; cursor: wait; }
  .chip { font-size: 13px; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .chip.on { border: 1.5px solid var(--accent); background: var(--soft); color: var(--accent-ink); font-weight: 700; }

  /* ===== 헤더 ===== */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .brand p { margin: 0 0 0 4px; font-size: 13px; color: var(--muted); }
  #viewBtn { border-radius: 999px; color: var(--accent-ink); font-weight: 500; }
  #viewBtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ===== 주간 달력 ===== */
  .week-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  #range { font-weight: 700; margin-right: auto; }
  .arrow { width: 38px; height: 38px; padding: 0; }
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .day { border: 1px solid transparent; background: #fff; color: var(--muted); border-radius: 16px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; }
  .day b { font-size: 22px; color: var(--ink); }
  .day small { font-size: 12px; min-height: 18px; }
  .day.has { background: var(--bg); border-color: var(--line); }
  .day.has small { color: var(--accent-ink); font-weight: 700; }
  .day.past { opacity: .5; }
  .day.today span { color: var(--accent-ink); font-weight: 700; }
  .day.sel, .day.sel * { background: var(--accent); border-color: var(--accent); color: #fff !important; opacity: 1; }
  .day:not(.sel):hover { border-color: var(--accent); }

  /* ===== 본문: 왼쪽 목록, 오른쪽 저장 폼 ===== */
  .layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  main { flex: 999 1 480px; min-width: 0; }
  aside { flex: 0 0 360px; max-width: 100%; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 20px; font-weight: 800; }
  .head select { padding: 7px 10px; font-size: 13px; }
  .head select:first-of-type { margin-left: auto; }
  .list { display: flex; flex-direction: column; gap: 14px; }
  .empty { border: 1.5px dashed var(--line); border-radius: 20px; padding: 28px; text-align: center; color: var(--muted); font-size: 14px; background: var(--card); }

  /* ===== 링크 카드 ===== */
  .card { background: var(--card); border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; border-left: 6px solid var(--accent); }
  .card.done { border-left-color: var(--line); }
  .card .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .card .title { margin: 0; font-size: 17px; font-weight: 700; word-break: break-all; }
  .card .meta { font-size: 13px; color: var(--muted); }
  .badge { align-self: flex-start; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 3px 9px; background: var(--soft); color: var(--accent-ink); }
  .badge.done { background: var(--green-soft); color: var(--green-ink); }
  .summary { margin: 0; padding: 12px 16px; background: var(--bg); border-radius: 14px; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
  .summary b { color: var(--accent-ink); margin-right: 6px; }
  .summary.none { color: var(--muted); font-style: italic; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .actions a { margin-left: auto; color: var(--accent-ink); font-size: 14px; font-weight: 500; text-decoration: none; }
  .inline { padding: 14px; border: 1.5px dashed var(--line); border-radius: 14px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .card-err { color: var(--danger); font-size: 13px; }

  /* ===== 저장 폼 ===== */
  form { display: flex; flex-direction: column; gap: 14px; }
  form h2 { margin: 0; font-size: 18px; font-weight: 800; }
  label, .label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; }
  form input { width: 100%; }
  .quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
  .hint { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .url-row { display: flex; gap: 6px; }
  .url-row input { flex: 1; min-width: 0; }
  .url-row .btn { white-space: nowrap; }
  #step2 { display: flex; flex-direction: column; gap: 14px; }
  .msg { display: none; padding: 11px 13px; border-radius: 12px; font-size: 14px; white-space: pre-wrap; }
  .msg.info { display: block; background: var(--bg); color: var(--muted); }
  .msg.ok { display: block; background: var(--green-soft); color: var(--green-ink); }
  .msg.warn { display: block; background: var(--warn-soft); color: var(--warn); }
  .msg.err { display: block; background: var(--danger-soft); color: var(--danger); }

  /* ===== 로그인 ===== */
  .user-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #who { font-size: 14px; color: var(--muted); }
  #who b { color: var(--ink); }
  #loginForm { max-width: 420px; margin: 40px auto; text-align: center; }
  #loginForm h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
  #loginForm p { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
  #loginForm .row { justify-content: center; }
  #loginForm input { width: 100%; margin-bottom: 8px; }
  #loginForm .row .btn { flex: 1; }
  #loginForm .msg { margin-top: 12px; text-align: left; }

  /* ===== 휴대폰 화면 ===== */
  @media (max-width: 860px) {
    .wrap { padding: 20px 16px 48px; gap: 18px; }
    #app { gap: 18px; }
    aside { flex-basis: 100%; order: -1; }
    .days { gap: 4px; }
    .day b { font-size: 18px; }
    .brand p { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6D4FD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></svg>
      <h1>다시봄</h1>
      <p>저장한 링크, 나중에 다시 보아요</p>
    </div>
    <div class="user-bar" id="userBar" hidden>
      <span id="who"></span>
      <button type="button" id="logoutBtn" class="btn text">로그아웃</button>
      <button type="button" id="viewBtn" class="btn">보관함 전체 보기</button>
    </div>
  </header>

  <!-- 처음 화면: 로그인 / 회원가입 -->
  <form id="loginForm" class="box" hidden>
    <h2>로그인</h2>
    <p>처음이라면 아이디와 비밀번호를 정하고 회원가입을 눌러 주세요</p>
    <input id="userInput" type="text" maxlength="20" placeholder="아이디 (2~20자)" aria-label="아이디" autocomplete="username">
    <input id="passInput" type="password" placeholder="비밀번호 (4자 이상)" aria-label="비밀번호" autocomplete="current-password">
    <div class="row">
      <button type="submit" class="btn main">로그인</button>
      <button type="button" id="signupBtn" class="btn">회원가입</button>
    </div>
    <div id="loginMsg" class="msg"></div>
  </form>

  <div id="app" hidden>

  <!-- 주간 달력: 화살표로 주 이동, 날짜를 누르면 그날 다시 볼 링크 -->
  <section class="box">
    <div class="week-top">
      <span id="range"></span>
      <button type="button" id="todayBtn" class="btn">오늘</button>
      <button type="button" id="prevWeek" class="btn arrow" aria-label="지난주">‹</button>
      <button type="button" id="nextWeek" class="btn arrow" aria-label="다음 주">›</button>
    </div>
    <div id="days" class="days"></div>
  </section>

  <div class="layout">
    <main>
      <!-- 날짜별 다시보기 (R3) -->
      <section id="dayView">
        <div class="head"><h2 id="dayTitle"></h2></div>
        <div id="dayList" class="list"></div>
      </section>

      <!-- 보관함 (R5) -->
      <section id="allView" hidden>
        <div class="head">
          <h2>보관함</h2>
          <select id="statusFilter" aria-label="상태">
            <option value="ALL">전체</option>
            <option value="UNCHECKED">아직 안 봄</option>
            <option value="CHECKED">확인 완료</option>
          </select>
          <select id="sortOrder" aria-label="정렬">
            <option value="newest">최신순</option>
            <option value="oldest">오래된 순</option>
          </select>
        </div>
        <div id="allList" class="list"></div>
      </section>
    </main>

    <!-- 링크 저장 (R1, R1-2, R2) -->
    <aside class="box">
      <form id="saveForm" autocomplete="off">
        <h2>링크 추가</h2>

        <!-- 1단계: URL 을 넣고 핵심 정리부터 본다 -->
        <div>
          <label for="url">URL</label>
          <div class="url-row">
            <input id="url" type="text" placeholder="https://" required>
            <button id="previewBtn" class="btn main" type="submit">핵심 정리 보기</button>
          </div>
        </div>
        <div id="previewMsg" class="msg"></div>

        <!-- 2단계: 정리를 보고 메모와 날짜를 정해 저장한다 (1단계가 끝나야 보인다) -->
        <div id="step2" hidden>
          <div id="previewBox"></div>
          <div>
            <label for="memo">저장 이유 <span style="font-weight:400;color:var(--muted)">(선택)</span></label>
            <textarea id="memo" maxlength="200" placeholder="예: 백엔드 과정 부트캠프"></textarea>
            <div class="hint" style="text-align:right"><span id="memoCount">0</span>/200</div>
          </div>
          <div>
            <span class="label">다시 볼 날</span>
            <div class="quick">
              <button type="button" class="chip" data-days="1">내일</button>
              <button type="button" class="chip" data-days="3">3일 후</button>
              <button type="button" class="chip" data-days="7">7일 후</button>
            </div>
            <input id="dueDate" type="date" aria-label="다시 볼 날짜">
            <p class="hint">위 달력에서 날짜를 눌러도 정할 수 있어요</p>
          </div>
          <button id="saveBtn" class="btn main" type="button">저장</button>
        </div>
        <div id="saveMsg" class="msg"></div>
      </form>
    </aside>
  </div>
  </div>
</div>

<script>
// ============================================================
// 1. 도우미: 날짜 계산, 글자 처리
// ============================================================
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const $ = (id) => document.getElementById(id);

// Date → "2026-11-13"
function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dateAfter(n) { return iso(addDays(new Date(), n)); }        // 오늘부터 n일 뒤
function mondayOf(d) { return addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay() + 6) % 7)); }
function koDate(s) { const [, m, d] = s.slice(0, 10).split("-"); return `${+m}월 ${+d}일`; }   // "11월 13일"
function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; } }

// 메모나 URL 에 <script> 같은 글자가 있어도 글자로만 보이게 바꾼다 (XSS 방지)
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ============================================================
// 2. 서버 요청: 모든 요청이 이 함수를 거친다. 결과는 { ok, data }
// ============================================================
// 로그인했으면 "Authorization: Bearer 토큰" 헤더를 붙인다. 토큰이 틀리면(401) 로그인 화면으로 돌아간다
async function api(method, path, body) {
  const headers = {};
  if (body) headers["Content-Type"] = "application/json";
  if (token) headers["Authorization"] = "Bearer " + token;
  try {
    const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const text = await res.text();
    if (res.status === 401 && token) logout();
    return { ok: res.ok, data: text ? JSON.parse(text) : null };
  } catch {
    return { ok: false, data: { error: "서버에 연결할 수 없습니다." } };
  }
}
const errorOf = (r) => (r.data && r.data.error) || "처리하지 못했어요.";

// ============================================================
// 3. 화면 상태
// ============================================================
const TODAY = dateAfter(0);
let token = "";                          // 로그인하면 서버가 주는 토큰 (브라우저에 저장해 새로고침해도 유지)
let weekStart = mondayOf(new Date());   // 보이는 주의 월요일
let selected = TODAY;                    // 선택한 날짜
let todayLinks = [];                     // 오늘 볼 링크 (날짜가 지난 미확인 포함)
let unchecked = [];                      // 미확인 링크 전체 (미래 날짜 개수 계산용)
let view = "day";                        // "day" = 날짜별, "all" = 보관함

// ============================================================
// 4. 불러오기: 서버에서 목록을 받아 화면 전체를 다시 그린다
// ============================================================
async function refresh() {
  const [t, u] = await Promise.all([
    api("GET", "/links/today"),
    api("GET", "/links?status=UNCHECKED&sort=oldest")
  ]);
  todayLinks = t.ok ? t.data : [];
  unchecked = u.ok ? u.data : [];
  document.title = todayLinks.length ? `(${todayLinks.length}) 다시봄 Re:See` : "다시봄 Re:See";   // 탭 제목에 오늘 개수
  renderWeek();
  renderDay();
  if (view === "all") loadAll();
}

// 그날 다시 볼 링크: 오늘 = 오늘 목록, 미래 = 그날 날짜인 미확인, 지난 날 = 없음(오늘 목록에 모여 있음)
function linksOn(day) {
  if (day === TODAY) return todayLinks;
  if (day < TODAY) return [];
  return unchecked.filter(l => l.dueDate === day);
}

// ============================================================
// 5. 주간 달력
// ============================================================
function renderWeek() {
  const end = addDays(weekStart, 6);
  $("range").textContent = `${weekStart.getFullYear()}년 ${weekStart.getMonth() + 1}월 ${weekStart.getDate()}일 ~ `
    + (end.getMonth() === weekStart.getMonth() ? "" : `${end.getMonth() + 1}월 `) + `${end.getDate()}일`;

  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i);
    const day = iso(d);
    const n = linksOn(day).length;
    const cls = ["day", n && "has", day < TODAY && "past", day === TODAY && "today", day === selected && "sel"].filter(Boolean).join(" ");
    html += `<button type="button" class="${cls}" data-day="${day}" aria-label="${koDate(day)}, 다시 볼 링크 ${n}개">
               <span>${day === TODAY ? "오늘" : DOW[d.getDay()]}</span><b>${d.getDate()}</b><small>${n ? n + "개" : ""}</small>
             </button>`;
  }
  $("days").innerHTML = html;
}

$("days").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-day]");
  if (btn) selectDay(btn.dataset.day);
});

function selectDay(day) {
  selected = day;
  if (day > TODAY) setDue(day);          // 미래 날짜를 누르면 저장 폼 날짜도 그날로
  showView("day");
  renderWeek();
  renderDay();
}

function moveWeek(n) { weekStart = addDays(weekStart, 7 * n); renderWeek(); }
$("prevWeek").addEventListener("click", () => moveWeek(-1));
$("nextWeek").addEventListener("click", () => moveWeek(1));
$("todayBtn").addEventListener("click", () => { weekStart = mondayOf(new Date()); selectDay(TODAY); });

// 선택한 날짜의 목록
function renderDay() {
  const d = new Date(selected + "T00:00");
  const label = selected === TODAY ? "오늘" : `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
  const links = linksOn(selected);
  let empty = "이날 다시 볼 링크가 없어요.";
  if (selected === TODAY) empty = "오늘 다시 볼 링크가 없어요. 새 링크를 추가해 보세요.";
  if (selected < TODAY) empty = "지난 날짜예요. 아직 안 본 링크는 오늘 목록에 모여 있어요.";

  $("dayTitle").textContent = selected < TODAY ? label : `${label} · 다시 볼 링크 ${links.length}개`;
  renderList($("dayList"), links, empty, false);
}

// ============================================================
// 6. 링크 카드
// ============================================================
let shown = {};   // id → 지금 화면에 있는 링크 (카드 버튼이 어떤 링크인지 찾을 때 사용)

function renderList(listEl, links, emptyText, inArchive) {
  links.forEach(l => { shown[l.id] = l; });
  listEl.innerHTML = links.length ? links.map(l => cardHtml(l, inArchive)).join("") : `<div class="empty">${emptyText}</div>`;
}

function cardHtml(link, inArchive) {
  const todo = link.status === "UNCHECKED";
  let badge = "";
  if (inArchive) badge = todo ? `<span class="badge">${koDate(link.dueDate)}에 다시 보기</span>` : `<span class="badge done">확인 완료</span>`;
  else if (link.dueDate < TODAY) badge = `<span class="badge">${koDate(link.dueDate)}부터 기다리는 중</span>`;

  return `
    <article class="card ${todo ? "" : "done"}" data-id="${link.id}">
      <div class="top">
        <p class="title">${esc(link.memo || hostOf(link.url))}</p>
        <span class="meta">${esc(hostOf(link.url))} · ${koDate(link.createdAt)} 저장</span>
      </div>
      ${badge}
      ${summaryHtml(link.summary)}
      <div class="actions">
        ${todo ? `<button type="button" class="btn main" data-act="check">확인 완료</button>` : ""}
        <button type="button" class="btn" data-act="review">다른 날 다시 보기</button>
        <button type="button" class="btn text" data-act="memo">메모 ${link.memo ? "수정" : "쓰기"}</button>
        <button type="button" class="btn text" data-act="delete">삭제</button>
        <a href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">링크 열기</a>
      </div>
      <div class="slot"></div>
    </article>`;
}

// 핵심 정리를 한 줄씩. "모집 마감: 11월 20일" 은 앞부분을 굵게, Gemini 가 붙인 ** 같은 기호는 지운다
function summaryHtml(summary) {
  if (!summary) return `<p class="summary none">핵심 정리 없음</p>`;
  const lines = summary.split("\n")
    .map(s => s.replace(/\*\*|__/g, "").replace(/^\s*(#+|[-•*·])\s*/, "").trim())
    .filter(Boolean)
    .map(line => {
      const i = line.indexOf(":");
      return (i > 0 && i <= 12)
        ? `<li><b>${esc(line.slice(0, i))}</b>${esc(line.slice(i + 1).trim())}</li>`
        : `<li>${esc(line)}</li>`;
    });
  return `<ul class="summary">${lines.join("")}</ul>`;
}

// ============================================================
// 7. 카드 버튼: 확인 완료, 다른 날 다시 보기, 메모 수정, 삭제 (R4, R1-2, R8)
// ============================================================
for (const listEl of [$("dayList"), $("allList")]) {
  listEl.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const card = btn.closest(".card");
    onCardButton(shown[card.dataset.id], btn.dataset.act, card.querySelector(".slot"));
  });
}

async function onCardButton(link, act, slot) {
  if (act === "check") {
    const r = await api("PATCH", `/links/${link.id}/status`, { action: "CHECK" });
    return r.ok ? refresh() : (slot.innerHTML = `<div class="card-err">${esc(errorOf(r))}</div>`);
  }
  if (act === "review") {
    openInline(slot, `
      <span class="label">언제 다시 볼까요?</span>
      <div class="row">
        <button type="button" class="chip" data-d="1">내일</button>
        <button type="button" class="chip on" data-d="3">3일 후</button>
        <button type="button" class="chip" data-d="7">7일 후</button>
        <input type="date" class="newDate" min="${TODAY}" value="${dateAfter(3)}" aria-label="새 날짜">
      </div>`,
      () => api("PATCH", `/links/${link.id}/status`, { action: "REVIEW", dueDate: slot.querySelector(".newDate").value }));
    const dateEl = slot.querySelector(".newDate");
    slot.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => {
      dateEl.value = dateAfter(+b.dataset.d);
      slot.querySelectorAll("[data-d]").forEach(x => x.classList.toggle("on", x === b));
    }));
    dateEl.addEventListener("input", () => slot.querySelectorAll("[data-d]").forEach(x => x.classList.remove("on")));
  }
  if (act === "memo") {
    openInline(slot, `<textarea class="memoEdit" maxlength="200" aria-label="메모">${esc(link.memo)}</textarea>`,
      () => api("PATCH", `/links/${link.id}/memo`, { memo: slot.querySelector(".memoEdit").value }));
  }
  if (act === "delete") {
    openInline(slot, `<span class="label">이 링크를 삭제할까요? 되돌릴 수 없어요.</span>`,
      () => api("DELETE", `/links/${link.id}`), "삭제");
  }
}

// 카드 아래에 작은 입력 칸을 열고, 저장(또는 okText)을 누르면 request() 를 보낸다. 실패하면 칸 아래에 오류 문구
function openInline(slot, innerHtml, request, okText = "저장") {
  slot.innerHTML = `
    <div class="inline">
      ${innerHtml}
      <div class="row">
        <button type="button" class="btn main save ${okText === "삭제" ? "danger" : ""}">${okText}</button>
        <button type="button" class="btn text cancel">취소</button>
      </div>
      <div class="card-err"></div>
    </div>`;
  slot.querySelector(".cancel").addEventListener("click", () => { slot.innerHTML = ""; });
  slot.querySelector(".save").addEventListener("click", async () => {
    const r = await request();
    if (r.ok) refresh();
    else slot.querySelector(".card-err").textContent = errorOf(r);
  });
}

// ============================================================
// 8. 링크 추가: 1단계 핵심 정리 보기 → 2단계 메모·날짜 정하고 저장 (R1, R1-2, R2)
// ============================================================
let preview = null;   // 1단계 결과 { url, summary, notice }. 없으면 아직 1단계

const chips = document.querySelectorAll("#saveForm .chip");

// 날짜 칸을 day 로 바꾸고, 같은 날짜인 단축 버튼을 켠다
function setDue(day) {
  $("dueDate").value = day;
  chips.forEach(c => c.classList.toggle("on", day === dateAfter(+c.dataset.days)));
}

function showMsg(id, kind, text) { $(id).className = "msg " + kind; $(id).textContent = text; }

// 처음 상태(1단계)로 되돌린다
function resetForm() {
  $("saveForm").reset();
  preview = null;
  $("step2").hidden = true;
  $("previewBtn").hidden = false;
  $("previewMsg").className = "msg";
  $("dueDate").min = TODAY;
  setDue(dateAfter(3));                  // 기본값: 오늘 + 3일
  $("memoCount").textContent = "0";
}

// 1단계: URL 칸에서 엔터를 치거나 "핵심 정리 보기"를 누르면
$("saveForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (preview) return;                   // 이미 2단계면 엔터는 무시 (저장은 버튼으로)
  $("previewBtn").disabled = true;
  $("previewBtn").textContent = "정리 중…";
  showMsg("previewMsg", "info", "링크를 읽고 핵심을 정리하고 있어요. 10초 정도 걸릴 수 있어요.");
  $("saveMsg").className = "msg";

  const r = await api("POST", "/links/preview", { url: $("url").value });

  $("previewBtn").disabled = false;
  $("previewBtn").textContent = "핵심 정리 보기";
  if (!r.ok) return showMsg("previewMsg", "err", errorOf(r));

  preview = r.data;
  $("url").value = preview.url;          // https:// 를 붙인 주소로 바꿔 보여 준다
  $("previewBtn").hidden = true;
  $("step2").hidden = false;
  if (preview.summary) {
    $("previewMsg").className = "msg";
    $("previewBox").innerHTML = summaryHtml(preview.summary);
  } else {
    showMsg("previewMsg", "warn", preview.notice);   // 정리 실패 → 메모를 적도록 안내
    $("previewBox").innerHTML = "";
    $("memo").focus();
  }
});

// URL 을 고치면 정리를 다시 받아야 하므로 1단계로 돌아간다
$("url").addEventListener("input", () => {
  if (!preview) return;
  const url = $("url").value;
  resetForm();
  $("url").value = url;
});

// 2단계: 저장
$("saveBtn").addEventListener("click", async () => {
  const r = await api("POST", "/links", {
    url: preview.url, summary: preview.summary, memo: $("memo").value, dueDate: $("dueDate").value
  });
  if (!r.ok) return showMsg("saveMsg", "err", errorOf(r));
  resetForm();
  showMsg("saveMsg", "ok", `저장했어요. ${koDate(r.data.dueDate)}에 다시 보여 드릴게요.`);
  refresh();
});

chips.forEach(c => c.addEventListener("click", () => setDue(dateAfter(+c.dataset.days))));
$("dueDate").addEventListener("input", (e) => setDue(e.target.value));
$("memo").addEventListener("input", (e) => { $("memoCount").textContent = e.target.value.length; });

// ============================================================
// 9. 보관함 (R5)
// ============================================================
async function loadAll() {
  const r = await api("GET", `/links?status=${$("statusFilter").value}&sort=${$("sortOrder").value}`);
  renderList($("allList"), r.ok ? r.data : [], "저장한 링크가 없어요.", true);
}
$("statusFilter").addEventListener("change", loadAll);
$("sortOrder").addEventListener("change", loadAll);

function showView(v) {
  view = v;
  $("dayView").hidden = v !== "day";
  $("allView").hidden = v !== "all";
  $("viewBtn").classList.toggle("on", v === "all");
  $("viewBtn").textContent = v === "all" ? "날짜별로 보기" : "보관함 전체 보기";
}
$("viewBtn").addEventListener("click", () => {
  showView(view === "all" ? "day" : "all");
  if (view === "all") loadAll();
});

// ============================================================
// 10. 시작
// ============================================================
// 로그인 상태를 브라우저에 저장한다 (새로고침해도 유지). 저장소를 못 쓰는 환경이면 그냥 넘어간다
function remember(key, value) {
  try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); } catch {}
}
function recall(key) {
  try { return localStorage.getItem(key) || ""; } catch { return ""; }
}

// 로그인된 화면으로
function enter(username, newToken) {
  token = newToken;
  remember("token", newToken);
  remember("username", username);
  $("loginForm").hidden = true;
  $("app").hidden = false;
  $("userBar").hidden = false;
  $("who").innerHTML = `<b>${esc(username)}</b> 님의 링크`;
  $("loginMsg").className = "msg";
  resetForm();
  refresh();
}

// 로그인 화면으로
function logout() {
  token = "";
  remember("token", "");
  remember("username", "");
  $("app").hidden = true;
  $("userBar").hidden = true;
  $("loginForm").hidden = false;
  $("passInput").value = "";
}

// 로그인(엔터 또는 버튼) / 회원가입: 성공하면 둘 다 바로 들어간다
async function sign(path) {
  const r = await api("POST", path, { username: $("userInput").value, password: $("passInput").value });
  if (r.ok) enter(r.data.username, r.data.token);
  else showMsg("loginMsg", "err", errorOf(r));
}
$("loginForm").addEventListener("submit", (e) => { e.preventDefault(); sign("/users/login"); });
$("signupBtn").addEventListener("click", () => sign("/users/signup"));
$("logoutBtn").addEventListener("click", logout);

// 저장된 로그인이 있으면 바로 들어가고, 없으면 로그인 화면
if (recall("token")) enter(recall("username"), recall("token"));
else logout();
</script>
