services:
  # DB 컨테이너: PostgreSQL. 기록은 resee-db-data 볼륨에 저장되어 컨테이너를 다시 만들어도 남는다(R6)
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: resee
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - resee-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d resee"]
      interval: 5s
      timeout: 3s
      retries: 10
    # DB 포트는 밖으로 열지 않는다. 앱 컨테이너만 접속한다

  # 앱 컨테이너: Spring Boot
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/resee
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy

volumes:
  resee-db-data:
